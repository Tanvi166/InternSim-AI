# Restricted dependency proxy. The only permitted destinations are exact hosts;
# no subdomain wildcards, plain HTTP requests, or non-HTTPS CONNECT are allowed.
http_port 3128
visible_hostname internsim-install-proxy

acl CONNECT method CONNECT
acl SSL_ports port 443
acl approved_package_registries dstdomain pypi.org files.pythonhosted.org

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT approved_package_registries
http_access deny all

cache deny all
